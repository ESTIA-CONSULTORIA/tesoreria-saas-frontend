server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Auditoría de service worker (GoodsHabits): sin Cache-Control explícito acá, sw.js
    # queda a merced de la heurística de caché del navegador (o de cualquier proxy/CDN
    # intermedio) — el polling de registration.update() (UpdatePrompt.tsx) no sirve de
    # nada si el propio archivo que se re-pide sigue siendo una copia vieja cacheada.
    # location = (match exacto) tiene prioridad sobre location / de abajo; try_files
    # $uri =404 en vez de heredar el fallback a index.html — si el archivo no existiera,
    # hoy serviría index.html disfrazado de service worker con 200, un fallo confuso de
    # diagnosticar en vez de un 404 claro.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Mismo motivo — sw.js carga este chunk en tiempo de ejecución (define(["./workbox-..."])),
    # así que necesita la misma garantía o el chequeo de sw.js por sí solo no alcanza. Regex
    # en vez del nombre exacto de hoy (workbox-2fbc6a65.js): ese hash depende de la versión
    # de la librería workbox, no del deploy — cambiaría si se actualiza vite-plugin-pwa, y un
    # nombre hardcodeado dejaría de matchear en silencio.
    location ~ ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    location /executive.html {
        try_files $uri =404;
    }
    location /kiosk.html {
        try_files $uri =404;
    }
}
