<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050B1A" />
    <title>ESTIA ERP</title>
    <script>
      // Skin antes de pintar (sin parpadeo): equipo > último valor del negocio > ESTIA. Mismas claves que src/core/theme/aplicarSkin.ts.
      (function () {
        try {
          var ok = ['estia', 'oscuro'];
          var s = localStorage.getItem('ui_skin_device');
          if (ok.indexOf(s) < 0) s = localStorage.getItem('ui_skin');
          document.documentElement.setAttribute('data-skin', ok.indexOf(s) >= 0 ? s : 'estia');
        } catch (e) { document.documentElement.setAttribute('data-skin', 'estia'); }
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
