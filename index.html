<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050B1A" />
    <title>ESTIA ERP</title>
    <script>
      // Skin antes de pintar (sin parpadeo): equipo > preferencia del usuario > último valor del negocio > ESTIA. Mismas claves y misma regla
      // que src/core/theme/aplicarSkin.ts; 'claro', 'contraste' e 'isotipo' (en preparación) solo para los roles ADMIN y SOPORTE de la sesión guardada.
      (function () {
        try {
          var ok = ['estia', 'oscuro'];
          var prep = ['claro', 'contraste', 'isotipo'];
          var rol = null;
          try { rol = (JSON.parse(localStorage.getItem('user') || 'null') || {}).roleCode; } catch (e) {}
          if (rol === 'ADMIN' || rol === 'SOPORTE') ok = ok.concat(prep);
          var skin = 'estia';
          var claves = ['ui_skin_device', 'ui_skin_user', 'ui_skin'];
          for (var i = 0; i < claves.length; i++) {
            var s = localStorage.getItem(claves[i]);
            if (ok.indexOf(s) >= 0) { skin = s; break; }
          }
          document.documentElement.setAttribute('data-skin', skin);
          if (localStorage.getItem('ui_pos_hex') === '1') document.documentElement.setAttribute('data-pos-hex', '1');
        } catch (e) { document.documentElement.setAttribute('data-skin', 'estia'); }
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
